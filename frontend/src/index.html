    window.addEventListener('DOMContentLoaded', () => {
      if (typeof Lenis !== 'undefined') {
        const lenis = new Lenis({
          autoRaf: true,
          autoToggle: true,
          anchors: true,
          allowNestedScroll: true,
          naiveDimensions: true,
          stopInertiaOnNavigate: true
        });
      }
    });
  </script>
