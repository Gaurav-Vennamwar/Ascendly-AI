<header class="topbar">
  <div class="title-group">
    <button
      class="menu-button"
      type="button"
      aria-label="Open navigation"
      (click)="menuRequested.emit()"
    >
      <i></i><i></i>
    </button>
    <div>
      <p class="eyebrow">{{ eyebrow() }}</p>
      <h1>{{ title() }}</h1>
      <p class="subtitle">{{ subtitle() }}</p>
    </div>
  </div>
  <div class="top-actions">
    <button class="icon-button" aria-label="Notifications">♧<span></span></button>
    <div class="top-avatar">JD</div>
  </div>
</header>
