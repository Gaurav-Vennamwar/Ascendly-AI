<section class="job-card">
  <div class="card-heading">
    <div>
      <span class="section-kicker">Step 02</span>
      <h2>Job description</h2>
      <p>Give the analyzer a target role to compare against.</p>
    </div>

    <span class="optional">Optional</span>
  </div>

  <label class="textarea-wrap">
    <span>Target role & requirements</span>

    <textarea
      [value]="jobDescription"
      (input)="onJobDescriptionChange($any($event.target).value)"
      [disabled]="locked()"
      placeholder="Paste the job description here..."
    ></textarea>

    <small>{{ jobDescription.length }} / 10,000 characters</small>
  </label>

  <div class="job-actions">
    <app-primary-button
  label="Clear"
  variant="ghost"
  [disabled]="locked()"
  (clicked)="jobDescription = ''"
></app-primary-button>

<app-primary-button
  label="Analyze resume"
  icon="✦"
  [disabled]="locked()"
  (clicked)="analyze()"
></app-primary-button>
  </div>
</section>
