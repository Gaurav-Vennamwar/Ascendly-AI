<app-workspace-layout title="Resume Analyzer" subtitle="Optimize your resume with AI.">
  <div class="dashboard-shell">
    <div class="main-column">
      <div class="input-grid">
        <app-resume-upload-card
          (resumeSelected)="onResumeSelected($event)"
          [locked]="isAnalyzing() || !!analysis()"
        ></app-resume-upload-card>

        <app-job-description-card
          (jobDescriptionChanged)="onJobDescriptionChanged($event)"
          (analyzeClicked)="analyzeResume()"
          [locked]="isAnalyzing() || !!analysis()"
        ></app-job-description-card>
      </div>

      @if (isAnalyzing()) {
        <div class="analysis-loading" role="status">
          <span class="analysis-pulse" aria-hidden="true"></span>
          <div><strong>Building your analysis</strong><p>Comparing your resume against the role requirements.</p></div>
        </div>
      }

      @if (errorMessage()) {
        <p class="analysis-error" role="alert">{{ errorMessage() }}</p>
      }

      @if (analysis(); as result) {
        <app-analysis-dashboard [analysis]="result"></app-analysis-dashboard>
      }
    </div>

    <app-insight-card
      [completed]="!!analysis()"
      [isAnalyzing]="isAnalyzing()"
      [durationSeconds]="analysisDurationSeconds()"
    ></app-insight-card>
  </div>
</app-workspace-layout>
