<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-card">
      <div class="form-head">
        <span class="eyebrow">Email verification</span>

        <h2>{{ status }}</h2>

        @if (success) {
          <p>Your email is verified. Return to registration to create your password and finish setting up your account.</p>
        } @else {
          <p>This verification link is invalid. Return to registration and request a new email.</p>
        }
      </div>

      @if (success) {
        <button
          class="submit-button"
          type="button"
          (click)="router.navigate(['/register'])"
        >
          Continue to registration →
        </button>
      } @else {
        <button class="submit-button" type="button" (click)="router.navigate(['/register'])">
          Try verification again →
        </button>
      }
    </div>
  </section>
</main>
